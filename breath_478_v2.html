<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-7-8 呼吸法 2.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(ellipse at 50% 30%, #14161d 0%, #0b0c10 70%);
            color: #c5c6c7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .container { text-align: center; width: 100%; max-width: 420px; padding: 20px; position: relative; }
        #status-text {
            font-size: 26px; font-weight: bold; color: #66fcf1;
            margin-bottom: 8px; letter-spacing: 2px; transition: color 0.5s ease;
        }
        #phase-text { font-size: 13px; color: #858585; margin-bottom: 4px; }
        #hint-text { font-size: 14px; color: #858585; height: 20px; margin-bottom: 8px; }

        .circle-container {
            position: relative; width: 240px; height: 240px; margin: 25px auto;
            display: flex; align-items: center; justify-content: center;
        }
        .outer-ring {
            position: absolute; width: 100%; height: 100%;
            border: 2px dashed #45f3ff; border-radius: 50%; opacity: 0.2;
        }
        /* 阶段进度环 */
        .progress-svg { position: absolute; width: 100%; height: 100%; transform: rotate(-90deg); }
        .progress-bg { fill: none; stroke: rgba(102,252,241,0.08); stroke-width: 4; }
        .progress-arc { fill: none; stroke: #66fcf1; stroke-width: 4; stroke-linecap: round; transition: stroke 0.5s ease; }

        .breathing-ball {
            width: 70px; height: 70px;
            background: radial-gradient(circle, #66fcf1 0%, #45f3ff 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(69, 243, 255, 0.5);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s linear, box-shadow 0.5s ease;
            z-index: 1;
        }
        #countdown-num {
            font-size: 22px; font-weight: 900; color: #0b0c10;
            transition: opacity 0.2s ease;
        }
        #stats-row {
            display: flex; justify-content: center; gap: 30px;
            font-size: 13px; color: #858585; margin-top: 6px; min-height: 18px;
        }
        #stats-row b { color: #66fcf1; font-weight: 600; }

        .btn {
            background-color: transparent; border: 2px solid #66fcf1; color: #66fcf1;
            padding: 12px 45px; font-size: 16px; border-radius: 25px; cursor: pointer;
            margin-top: 28px; transition: all 0.3s ease; font-weight: bold; letter-spacing: 1px;
        }
        .btn:active { background-color: #66fcf1; color: #0b0c10; }
        .btn.small { padding: 8px 16px; font-size: 13px; margin-top: 14px; border-color: #4a4e58; color: #9aa0ab; }

        /* 开关行 */
        .toggles { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
        .toggle-btn {
            background: transparent; border: 1px solid #4a4e58; color: #9aa0ab;
            border-radius: 16px; padding: 6px 14px; font-size: 12px; cursor: pointer; transition: all 0.3s;
        }
        .toggle-btn.on { border-color: #66fcf1; color: #66fcf1; }

        /* 设置弹窗 */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: none; align-items: center; justify-content: center; z-index: 10;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: #14161d; border: 1px solid #2a2d35; border-radius: 16px;
            padding: 24px; width: 85%; max-width: 320px; text-align: center;
        }
        .modal h3 { color: #66fcf1; font-size: 16px; margin-bottom: 16px; letter-spacing: 1px; }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px; font-size: 14px; color: #c5c6c7;
        }
        .setting-row input {
            width: 64px; background: #0b0c10; border: 1px solid #4a4e58; color: #66fcf1;
            border-radius: 8px; padding: 6px 8px; font-size: 14px; text-align: center; outline: none;
        }
        .modal .btn { margin-top: 10px; padding: 10px 30px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div id="status-text">准备就绪</div>
    <div id="phase-text">4-7-8 呼吸法</div>
    <div id="hint-text">点击下方按钮开启完美数字同步引导</div>

    <div class="circle-container">
        <div class="outer-ring"></div>
        <svg class="progress-svg" viewBox="0 0 240 240">
            <circle class="progress-bg" cx="120" cy="120" r="110"></circle>
            <circle class="progress-arc" id="progressArc" cx="120" cy="120" r="110"
                    stroke-dasharray="691.15" stroke-dashoffset="691.15"></circle>
        </svg>
        <div class="breathing-ball" id="ball">
            <div id="countdown-num"></div>
        </div>
    </div>

    <div id="stats-row">
        <span>第 <b id="cycle-num">0</b> 轮</span>
        <span>本次 <b id="session-time">00:00</b></span>
    </div>

    <button class="btn" id="startBtn">开 始</button>

    <div class="toggles">
        <button class="toggle-btn on" id="soundBtn">🔔 提示音</button>
        <button class="toggle-btn on" id="vibrateBtn">📳 振动</button>
        <button class="toggle-btn" id="settingsBtn">⚙️ 自定义</button>
    </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="modalMask">
    <div class="modal">
        <h3>自定义呼吸节奏</h3>
        <div class="setting-row"><span>吸气（秒）</span><input type="number" id="inTime" min="1" max="20" value="4"></div>
        <div class="setting-row"><span>屏气（秒）</span><input type="number" id="holdTime" min="1" max="20" value="7"></div>
        <div class="setting-row"><span>呼气（秒）</span><input type="number" id="outTime" min="1" max="20" value="8"></div>
        <button class="btn" id="saveSettings">保存并开始</button>
        <button class="btn small" id="resetSettings">恢复 4-7-8 默认</button>
    </div>
</div>

<script>
    // ---------- DOM ----------
    const ball = document.getElementById('ball');
    const statusText = document.getElementById('status-text');
    const phaseText = document.getElementById('phase-text');
    const hintText = document.getElementById('hint-text');
    const startBtn = document.getElementById('startBtn');
    const countdownNum = document.getElementById('countdown-num');
    const cycleNum = document.getElementById('cycle-num');
    const sessionTimeEl = document.getElementById('session-time');
    const progressArc = document.getElementById('progressArc');
    const ARC_LEN = 691.15;

    // ---------- 状态 ----------
    let isRunning = false;
    let mainTimer = null;
    let tickInterval = null;      // 倒计时 + 进度环
    let sessionInterval = null;   // 总时长计时
    let sessionStart = 0;
    let cycleCount = 0;
    let soundOn = true;
    let vibrateOn = true;
    let audioCtx = null;

    // 每一阶段的时间配置（秒），可由用户自定义
    const STAGES = {
        INHALE: { key: 'in',  name: "吸 气", hint: "用鼻子平稳吸气，小腹鼓起", color: "#66fcf1", time: 4, scale: "2.6" },
        HOLD:   { key: 'hold',name: "屏 气", hint: "保持冥想状态，让神经镇静", color: "#ffb703", time: 7, scale: "2.6" },
        EXHALE: { key: 'out', name: "呼 气", hint: "极慢地用鼻子呼气，意念下沉", color: "#45f3ff", time: 8, scale: "1.1" }
    };

    // ---------- 提示音（Web Audio，柔和双音） ----------
    function playChime(freq) {
        if (!soundOn) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t = audioCtx.currentTime;
            [[freq, 0], [freq * 1.5, 0.12]].forEach(([f, delay]) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = f;
                gain.gain.setValueAtTime(0, t + delay);
                gain.gain.linearRampToValueAtTime(0.18, t + delay + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + delay + 0.9);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t + delay); osc.stop(t + delay + 1);
            });
        } catch (e) { /* 环境不支持时静默 */ }
    }

    // ---------- 振动 ----------
    function buzz(pattern) {
        if (vibrateOn && navigator.vibrate) navigator.vibrate(pattern);
    }

    // ---------- 倒计时（修正版：基于时间戳，不吞毫秒，完整显示到 1） ----------
    function startTimer(durationSec) {
        clearInterval(tickInterval);
        const endTime = Date.now() + durationSec * 1000;
        countdownNum.innerText = durationSec;

        tickInterval = setInterval(() => {
            const remainMs = endTime - Date.now();
            if (remainMs <= 0) {
                countdownNum.innerText = "";   // 阶段切换瞬间清空，由下一阶段立即重写
                clearInterval(tickInterval);
                return;
            }
            // ceil 保证最后一秒完整显示 "1"，不会从 2 直接跳到空
            countdownNum.innerText = Math.ceil(remainMs / 1000);
            // 进度环
            const ratio = 1 - remainMs / (durationSec * 1000);
            progressArc.style.strokeDashoffset = ARC_LEN * (1 - ratio);
        }, 50);
    }

    // ---------- 阶段切换公共逻辑 ----------
    function enterStage(stage) {
        statusText.innerText = `${stage.name} · ${stage.time} 秒`;
        hintText.innerText = stage.hint;
        statusText.style.color = stage.color;
        progressArc.style.stroke = stage.color;
        ball.style.boxShadow = `0 0 35px ${stage.color}80`;
        playChime({ in: 523, hold: 392, out: 330 }[stage.key]);
        buzz([60]);
    }

    function runInhale() {
        if (!isRunning) return;
        if (cycleCount > 0) { /* 非首轮才重置进度环，避免首轮闪烁 */ }
        enterStage(STAGES.INHALE);
        ball.style.transition = `transform ${STAGES.INHALE.time}s linear`;
        ball.style.transform = `scale(${STAGES.INHALE.scale})`;
        startTimer(STAGES.INHALE.time);
        mainTimer = setTimeout(runHold, STAGES.INHALE.time * 1000);
    }

    function runHold() {
        if (!isRunning) return;
        enterStage(STAGES.HOLD);
        ball.style.transition = "none";
        ball.style.transform = `scale(${STAGES.HOLD.scale})`;
        startTimer(STAGES.HOLD.time);
        mainTimer = setTimeout(runExhale, STAGES.HOLD.time * 1000);
    }

    function runExhale() {
        if (!isRunning) return;
        enterStage(STAGES.EXHALE);
        ball.style.transition = `transform ${STAGES.EXHALE.time}s linear`;
        ball.style.transform = `scale(${STAGES.EXHALE.scale})`;
        startTimer(STAGES.EXHALE.time);
        mainTimer = setTimeout(() => {
            cycleCount++;
            cycleNum.innerText = cycleCount;
            runInhale(); // 自动进入下一次循环
        }, STAGES.EXHALE.time * 1000);
    }

    // ---------- 总时长计时 ----------
    function startSessionClock() {
        sessionStart = Date.now();
        sessionInterval = setInterval(() => {
            const s = Math.floor((Date.now() - sessionStart) / 1000);
            const m = String(Math.floor(s / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            sessionTimeEl.innerText = `${m}:${ss}`;
        }, 500);
    }

    // ---------- 开始 / 停止 ----------
    startBtn.addEventListener('click', () => {
        if (!isRunning) {
            isRunning = true;
            cycleCount = 0;
            cycleNum.innerText = "0";
            sessionTimeEl.innerText = "00:00";
            startBtn.innerText = "停 止";
            countdownNum.style.opacity = "1";
            startSessionClock();
            buzz([80]);
            runInhale();
        } else {
            isRunning = false;
            clearTimeout(mainTimer);
            clearInterval(tickInterval);
            clearInterval(sessionInterval);
            startBtn.innerText = "开 始";
            statusText.innerText = "已停止";
            statusText.style.color = "#66fcf1";
            hintText.innerText = "点击开始重新开启同步引导";
            countdownNum.innerText = "";
            ball.style.transition = "transform 0.4s ease";
            ball.style.transform = "scale(1)";
            ball.style.boxShadow = "0 0 25px rgba(69,243,255,0.5)";
            progressArc.style.strokeDashoffset = ARC_LEN;
            buzz([30]);
        }
    });

    // ---------- 开关 ----------
    document.getElementById('soundBtn').addEventListener('click', function () {
        soundOn = !soundOn;
        this.classList.toggle('on', soundOn);
        this.innerText = soundOn ? "🔔 提示音" : "🔕 提示音关";
        if (soundOn) playChime(523);
    });
    document.getElementById('vibrateBtn').addEventListener('click', function () {
        vibrateOn = !vibrateOn;
        this.classList.toggle('on', vibrateOn);
        this.innerText = vibrateOn ? "📳 振动" : "📴 振动关";
        if (vibrateOn) buzz([60]);
    });

    // ---------- 自定义设置 ----------
    const modalMask = document.getElementById('modalMask');
    const inInput = document.getElementById('inTime');
    const holdInput = document.getElementById('holdTime');
    const outInput = document.getElementById('outTime');

    document.getElementById('settingsBtn').addEventListener('click', () => {
        // 若正在运行则先停止，避免节奏冲突
        if (isRunning) startBtn.click();
        inInput.value = STAGES.INHALE.time;
        holdInput.value = STAGES.HOLD.time;
        outInput.value = STAGES.EXHALE.time;
        modalMask.classList.add('show');
    });
    document.getElementById('saveSettings').addEventListener('click', () => {
        const v = el => Math.min(20, Math.max(1, parseInt(el.value) || 4));
        STAGES.INHALE.time = v(inInput);
        STAGES.HOLD.time = v(holdInput);
        STAGES.EXHALE.time = v(outInput);
        phaseText.innerText = `${STAGES.INHALE.time}-${STAGES.HOLD.time}-${STAGES.EXHALE.time} 呼吸法 · 激活副交感神经`;
        modalMask.classList.remove('show');
    });
    document.getElementById('resetSettings').addEventListener('click', () => {
        inInput.value = 4; holdInput.value = 7; outInput.value = 8;
    });
    modalMask.addEventListener('click', e => {
        if (e.target === modalMask) modalMask.classList.remove('show');
    });

    // 页面隐藏时自动暂停计时漂移：切回前台重新对齐进度环（基于剩余时间的倒计时天然抗漂移）
</script>
</body>
</html>
